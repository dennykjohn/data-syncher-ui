server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Email/billing assets (public/static/billing) — never SPA-fallback to index.html
  location /static/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
