server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # After each deploy, hashed files under /assets/ change. Browsers must not keep an old
  # index.html that references deleted chunk names.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Email/billing assets (public/static/billing) — never SPA-fallback to index.html
  location /static/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
